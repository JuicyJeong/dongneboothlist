[project]
name = "dongneboothlist"
version = "2.0.0"
description = "동인네트워크 부스 정보 수집 및 분석 도구"
authors = [
    { name = "PPJ", email = "jinwoo327@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
twitter = [
    "selenium>=4.0.0",
]
viz = [
    "matplotlib>=3.7.0",
]

[project.scripts]
dongne-crawl = "src.crawler.raw_exporter:crawl_raw_data_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.black]
line-length = 100
target-version = ["py39"]
